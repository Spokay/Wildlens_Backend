name: Wildlens Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test-and-lint:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing


    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12.0
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.0"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

  docker-build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: Wildlens Environement
    env:
      DOCKER_REGISTRY_HOST: ${{ vars.DOCKER_REGISTRY_HOST }}
      FINAL_IMAGE_NAME: ${{ vars.DOCKER_REGISTRY_HOST }}/${{ vars.IMAGE_NAME }}:latest
    steps:
    # Build the docker image
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ${{ env.FINAL_IMAGE_NAME }}


    # Login to the registry
    - name: Docker Login
      uses: docker/login-action@v3.4.0
      with:
        # Server address of Docker registry. If not set then will default to Docker Hub
        registry: ${{ env.DOCKER_REGISTRY_HOST }}
        # Username used to log against the Docker registry
        username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        # Specifies whether the given registry is ECR (auto, true or false)
        ecr: false
        # Log out from the Docker registry at the end of a job
        logout: true

    # Push image to the registry
    - name: Docker push
      run: docker push ${{ env.FINAL_IMAGE_NAME }}